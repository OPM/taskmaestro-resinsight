[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskmaestro-resinsight"
version = "0.2.0"
description = "ResInsight tasks and example workflows for taskmaestro"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ceetron Solutions", email = "info@ceetronsolutions.com" }]
keywords = ["workflow", "dag", "pipeline", "taskmaestro", "resinsight", "reservoir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "taskmaestro>=0.2.0,<0.3.0",
    "rips",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
]

[project.urls]
Homepage = "https://github.com/OPM/taskmaestro-resinsight"
Repository = "https://github.com/OPM/taskmaestro-resinsight"
Issues = "https://github.com/OPM/taskmaestro-resinsight/issues"

[project.entry-points."taskmaestro.tasks"]
"resinsight.add_perforation" = "taskmaestro_resinsight.add_perforation:AddPerforation"
"resinsight.connect" = "taskmaestro_resinsight.connect_to_resinsight:ConnectToResInsight"
"resinsight.create_grid_view" = "taskmaestro_resinsight.create_grid_view:CreateGridView"
"resinsight.export_completions" = "taskmaestro_resinsight.export_completions:ExportCompletions"
"resinsight.launch" = "taskmaestro_resinsight.launch_resinsight:LaunchResInsight"
"resinsight.load_model" = "taskmaestro_resinsight.load_model:LoadModel"
"resinsight.load_well_path" = "taskmaestro_resinsight.load_well_path:LoadWellPath"
"resinsight.import_grid_property" = "taskmaestro_resinsight.import_grid_property:ImportGridProperty"
"resinsight.select_eclipse_case" = "taskmaestro_resinsight.select_eclipse_case:SelectEclipseCase"
"resinsight.select_well_path" = "taskmaestro_resinsight.select_well_path:SelectWellPath"

[project.entry-points."taskmaestro.workflows"]
"resinsight.completions" = "taskmaestro_resinsight.workflows:resinsight_completions"

[tool.hatch.build.targets.sdist]
exclude = [
    "vendor",
    "scripts",
]

[tool.hatch.build.targets.wheel]
packages = ["taskmaestro_resinsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["vendor"]
